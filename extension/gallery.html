<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图提取 · 图片预览</title>
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <!-- 顶部工具栏 -->
  <header class="toolbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">🖼️</span>
      <h1>图提取</h1>
      <span class="sub">图片预览与下载</span>
    </div>
    <div class="actions">
      <button id="selectAllBtn" class="btn ghost" type="button">全选</button>
      <button id="invertBtn" class="btn ghost" type="button">反选</button>
      <span id="countLabel" class="count">已选 0 张</span>
      <button id="downloadBtn" class="btn primary" type="button">下载选中</button>
    </div>
  </header>

  <!-- 下载进度条 -->
  <div id="progressWrap" class="progress-wrap" hidden>
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    <span id="progressText" class="progress-text"></span>
  </div>

  <!-- 图片网格 -->
  <main id="grid" class="grid"></main>

  <!-- 空状态 -->
  <div id="empty" class="empty" hidden>
    <div class="empty-icon">🖼️</div>
    <p>没有可展示的图片</p>
    <p class="hint">请回到商品详情页，点击「获取图片」后重试</p>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
